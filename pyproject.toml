[project]
name = "zagred"
version = "0.1.0"
description = "Desktop apps from Python backends and web frontends, built with pywebview and Nuitka"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Muhammad Arief Minardi", email = "ariefminardi005@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: User Interfaces",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.0",
]

[project.optional-dependencies]
build = ["nuitka>=4.2"]

[project.scripts]
zagred = "zagred.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
