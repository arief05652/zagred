[project]
site_name = "Zagred"
site_description = "Desktop apps with a Python backend and a web frontend"
site_author = "Muhammad Arief Minardi"
site_url = "https://arief05652.github.io/zagred/"
repo_url = "https://github.com/arief05652/zagred"
repo_name = "arief05652/zagred"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Muhammad Arief Minardi &mdash; MIT"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Backend" = "backend.md" },
  { "Frontend" = "frontend.md" },
  { "Hotkeys" = "hotkeys.md" },
  { "zagred.toml" = "manifest.md" },
  { "Building" = "build.md" },
  { "CLI" = "cli.md" },
  { "API reference" = "reference.md" },
  { "Troubleshooting" = "troubleshooting.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/app-window"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/arief05652/zagred"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
